name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Code format
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Set up Node, pnpm, and formatting tools
        uses: Perdolique/automations/.github/actions/setup-pnpm@v4
        with:
          install-dependencies: true
      - run: pnpm run format:check

  android-test:
    name: Android test APKs
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master')
    needs: format
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    concurrency:
      group: android-test-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Set up Node and pnpm
        uses: Perdolique/automations/.github/actions/setup-pnpm@v4
        with:
          working-directory: ci
      - name: Restore full history and remove checkout credentials
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: pnpm --dir ci install --frozen-lockfile
      - name: Check Google Play release notes
        run: pnpm --dir ci run check:play-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Check and build Debug and Preview
        run: pnpm --dir ci run build:test
        env:
          GH_TOKEN: ${{ github.token }}
          PP_PR_NUMBER: ${{ github.event.pull_request.number }}
      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: pole-parkla-debug
          path: ci/artifacts/pole-parkla-debug.apk
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
          compression-level: 0
          if-no-files-found: error
      - name: Upload Preview APK
        uses: actions/upload-artifact@v7
        with:
          name: pole-parkla-preview
          path: ci/artifacts/pole-parkla-preview.apk
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
          compression-level: 0
          if-no-files-found: error
      - name: Remove temporary signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/pole-parkla-signing"

  android-production:
    name: Android production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [format, node]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment: android-production
    permissions:
      contents: write
    concurrency:
      group: android-production
      queue: max
      cancel-in-progress: false
    steps:
      - name: Set up Node and pnpm
        uses: Perdolique/automations/.github/actions/setup-pnpm@v4
        with:
          working-directory: ci
      - name: Restore full history and remove checkout credentials
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: pnpm --dir ci install --frozen-lockfile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and release production Android
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            pnpm --dir ci run build:production
          else
            pnpm --dir ci run release
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Upload manual production build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: pole-parkla-production
          path: ci/artifacts/*
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
      - name: Remove temporary signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/pole-parkla-signing"

  node:
    name: ${{ matrix.project }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [worker, site, ci]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Set up Node, pnpm, and dependencies
        uses: Perdolique/automations/.github/actions/setup-pnpm@v4
        with:
          working-directory: ${{ matrix.project }}
          install-dependencies: true
      - name: Check recognition Worker
        if: matrix.project == 'worker'
        run: pnpm run check
      - name: Package recognition Worker without deployment
        if: matrix.project == 'worker'
        run: pnpm run deploy:dry
      - name: Check website types
        if: matrix.project == 'site'
        run: pnpm test:typecheck
      - name: Build website and check SEO
        if: matrix.project == 'site'
        run: pnpm run test:seo
      - name: Check release tools
        if: matrix.project == 'ci'
        run: pnpm run check
